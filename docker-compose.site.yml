# Статический сайт: Caddy отдаёт готовый site/dist.
# Запуск на сервере: make build-prod && docker compose -f docker-compose.site.yml up -d
services:
  site:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: site/settings.env
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN не задан}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
